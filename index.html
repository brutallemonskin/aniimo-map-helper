<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伊莫 · 地宫领航</title><link rel="stylesheet" href="style.css?v=7"></head><body>
<header><div class="brand"><b>◈</b><strong>地宫领航</strong><span class="subtitle">ANIIMO / LOCAL NAVIGATOR</span></div><div class="header-actions"><select id="language" aria-label="Language / 语言"><option value="zh-CN">中文</option><option value="en">English</option></select><span class="pill" id="engine">准备识别…</span><button id="newrun">新一局</button><button id="focus" aria-pressed="false">专注地图</button></div></header>
<main><article aria-label="地宫地图">
<div id="mapwrap"><canvas id="map" aria-label="可缩放地宫地图"></canvas><div class="map-tag">● 本地地图 <span>·</span> <span id="viewmode">全图浏览</span></div><div class="region-controls"><select id="sea-region" aria-label="海岛分区" hidden><option value="auto">自动跟随所在分区</option><option value="all">全岛总览</option></select><button id="region-follow" hidden>当前分区</button></div><div class="zoom-controls"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="fit">全图</button></div><div class="legend"><span><i class="area-key"></i>画面范围</span><span><i class="position-key"></i>角色位置</span><small>滚轮缩放 · 拖动平移</small></div><div id="tooltip"></div></div><footer><span id="mapinfo">地图加载中</span><span>素材：Wikily /《伊莫》</span></footer></article>
<aside aria-label="领航控制台"><section class="result panel"><div class="section-head"><h1>探索领航</h1><span class="status-tag" id="capture-status">未连接画面</span></div><span class="eyebrow">当前识别</span><p id="position-status" class="hint">自动追踪黄色角色箭头</p><h2 id="result" aria-live="polite">等待游戏画面</h2><p id="reason" class="muted">选择游戏窗口并打开地图。请保留黄门、蓝门，迷雾无需裁掉。</p><div id="candidates"></div></section>
<section class="panel capture-panel"><div class="section-head"><h3>游戏画面</h3><span class="privacy-dot">仅在本机处理</span></div><div class="capture-actions"><button id="share" class="primary">选择游戏窗口</button><button id="stop" disabled>停止</button></div><div class="overlay-controls"><button id="overlay" aria-pressed="false">游戏悬浮窗</button><p id="overlay-hint">置顶半透明地图 · 识别地宫后同步显示<br>Alt+Shift+M 切换鼠标穿透 · Alt+Shift+H 隐藏/显示</p></div><div class="preview"><canvas id="capture" width="640" height="360"></canvas><div id="empty"><span>▣</span>等待连接游戏窗口<small>也可直接 Ctrl+V 粘贴截图</small></div></div><div class="capture-bottom"><label class="upload" tabindex="0">导入截图<input id="file" type="file" accept="image/*" hidden></label><button id="once">立即识别</button><label class="frequency"><select id="interval" aria-label="识别间隔"><option value="250" selected>每 0.25 秒</option><option value="500">每 0.5 秒</option><option value="1000">每 1 秒</option><option value="2000">每 2 秒</option><option value="4000">每 4 秒</option><option value="8000">每 8 秒</option></select></label></div><label class="mode-choice">海岛模式 <select id="outdoor-mode" aria-label="海岛模式"><option value="egg-heist" selected>普通抢蛋</option><option value="egg-heist-team-mode">小队模式</option></select></label></section>
<section class="panel"><details open class="points-panel"><summary>地图点位 <span>按需显示</span></summary><div id="filters"></div></details></section>
<div class="aside-footer">地图在本地 · 探索由你决定</div></aside></main><video id="video" autoplay muted playsinline hidden></video><script src="i18n.js?v=1"></script><script src="app.js?v=23"></script></body></html>
